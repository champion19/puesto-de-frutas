spring.application.name=puesto-frutas

# Los tests usan H2 en memoria (modo MySQL), no necesitan Docker
spring.datasource.url=jdbc:h2:mem:puesto_frutas;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.open-in-view=false
