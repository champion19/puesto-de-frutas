spring.application.name=puesto-frutas

# Conexion a MySQL (credenciales por variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:puesto_frutas}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea schema.sql; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
